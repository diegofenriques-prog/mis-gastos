<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Mis Gastos"/>
<meta name="theme-color" content="#0F172A"/>
<title>Mis Gastos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
:root{
  --bg:#0F172A;--bg2:#1E293B;--bg3:#334155;
  --txt:#F1F5F9;--txt2:#94A3B8;--txt3:#64748B;
  --accent:#38BDF8;--accent2:#0EA5E9;
  --danger:#F87171;--success:#34D399;
  --border:rgba(255,255,255,0.08);
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font)}
#app{height:100%;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative}

/* TOPBAR */
.topbar{
  padding:calc(var(--safe-top) + 16px) 20px 16px;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.topbar h1{font-size:22px;font-weight:600;color:var(--txt);letter-spacing:-0.5px}
.topbar p{font-size:13px;color:var(--txt2);margin-top:2px}

/* SCREENS */
.screen{display:none;flex:1;overflow-y:auto;padding:16px 16px 8px;flex-direction:column;gap:12px}
.screen.active{display:flex}
.screen::-webkit-scrollbar{display:none}

/* NAVBAR */
.navbar{
  display:flex;flex-shrink:0;
  padding-bottom:var(--safe-bottom);
  background:var(--bg2);
  border-top:1px solid var(--border);
}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;background:none;border:none;cursor:pointer;font-family:var(--font);font-size:10px;color:var(--txt3);transition:color .15s}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:22px;height:22px;stroke-width:1.8}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px}
.stat-card.accent{background:linear-gradient(135deg,#0369A1,#0EA5E9);border:none}
.stat-lbl{font-size:11px;color:var(--txt2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.stat-card.accent .stat-lbl{color:rgba(255,255,255,.7)}
.stat-val{font-size:22px;font-weight:600;font-family:var(--mono);color:var(--txt);letter-spacing:-1px}
.stat-card.accent .stat-val{color:#fff}
.stat-val.red{color:var(--danger)}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px}
.card-title{font-size:12px;font-weight:500;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}

/* ITEMS */
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:none}
.item-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.item-body{flex:1;min-width:0}
.item-desc{font-size:14px;font-weight:500;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:11px;color:var(--txt3);margin-top:2px}
.item-amt{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--danger);flex-shrink:0}
.item-del{background:none;border:none;cursor:pointer;color:var(--txt3);font-size:16px;padding:4px;line-height:1;flex-shrink:0}
.empty-state{text-align:center;padding:32px 0;color:var(--txt3);font-size:13px}

/* FORM */
.field{margin-bottom:12px}
.field label{font-size:12px;font-weight:500;color:var(--txt2);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select{
  width:100%;font-size:16px;font-family:var(--font);
  padding:12px 14px;
  background:var(--bg3);color:var(--txt);
  border:1px solid var(--border);border-radius:12px;
  outline:none;transition:border-color .2s;
  -webkit-appearance:none;appearance:none;
}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field input::placeholder{color:var(--txt3)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-main{
  width:100%;padding:15px;font-size:16px;font-weight:600;
  font-family:var(--font);
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  color:#0F172A;border:none;border-radius:14px;
  cursor:pointer;letter-spacing:-.2px;
  transition:transform .1s,opacity .1s;
  margin-top:4px;
}
.btn-main:active{transform:scale(0.97);opacity:.9}

/* FILTER */
.filter-row{display:flex;gap:8px;margin-bottom:10px}
.filter-row select{flex:1;font-size:13px;padding:8px 10px;background:var(--bg2);color:var(--txt2);border:1px solid var(--border);border-radius:10px;font-family:var(--font);outline:none;-webkit-appearance:none}

/* BARS */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-icon{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.bar-lbl{font-size:12px;color:var(--txt2);width:72px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-wrap{flex:1;background:var(--bg3);border-radius:6px;height:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;transition:width .4s}
.bar-amt{font-size:11px;font-family:var(--mono);color:var(--txt3);width:60px;text-align:right;flex-shrink:0}

/* TOAST */
.toast{
  position:absolute;top:calc(var(--safe-top) + 16px);left:50%;transform:translateX(-50%) translateY(-80px);
  background:var(--success);color:#0F172A;font-size:13px;font-weight:600;
  padding:10px 20px;border-radius:30px;
  opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:100;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* INSTALL BANNER */
.install-banner{
  background:linear-gradient(135deg,#0369A1,#0EA5E9);
  border-radius:14px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;
  margin-bottom:4px;
}
.install-txt{flex:1;font-size:13px;color:rgba(255,255,255,.9);line-height:1.4}
.install-txt strong{display:block;color:#fff;font-size:14px;margin-bottom:2px}
.install-close{background:rgba(0,0,0,.2);border:none;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:var(--font);white-space:nowrap}
</style>
</head>
<body>
<div id="app">
<div id="toast" class="toast"></div>

<!-- SCREEN: HOME -->
<div id="s-home" class="screen active">
  <div class="topbar">
    <h1>Mis gastos</h1>
    <p id="home-mes">—</p>
  </div>
  <div id="install-banner" class="install-banner" style="display:none">
    <div style="font-size:28px">📲</div>
    <div class="install-txt"><strong>Instalá la app</strong>Tocá Compartir → "Agregar a inicio"</div>
    <button class="install-close" onclick="document.getElementById('install-banner').style.display='none'">Listo</button>
  </div>
  <div class="stats-grid">
    <div class="stat-card accent"><div class="stat-lbl">Este mes</div><div class="stat-val" id="h-mes">$0</div></div>
    <div class="stat-card"><div class="stat-lbl">Total general</div><div class="stat-val red" id="h-tot">$0</div></div>
  </div>
  <div class="card">
    <div class="card-title">Últimos gastos</div>
    <div id="home-list"><div class="empty-state">Todavía no hay gastos</div></div>
  </div>
</div>

<!-- SCREEN: NUEVO -->
<div id="s-nuevo" class="screen">
  <div class="topbar"><h1>Nuevo gasto</h1><p>Registrá un gasto</p></div>
  <div class="card">
    <div class="field"><label>Descripción</label><input type="text" id="n-desc" placeholder="Ej: supermercado, nafta..." maxlength="60" autocomplete="off"/></div>
    <div class="field-row">
      <div class="field"><label>Importe ($)</label><input type="number" id="n-imp" placeholder="0.00" inputmode="decimal" min="0" step="0.01"/></div>
      <div class="field"><label>Fecha</label><input type="date" id="n-fecha"/></div>
    </div>
    <div class="field"><label>Categoría</label>
      <select id="n-cat">
        <option value="comida">🍔 Comida</option>
        <option value="transporte">🚗 Transporte</option>
        <option value="servicios">💡 Servicios</option>
        <option value="salud">🏥 Salud</option>
        <option value="entretenimiento">🎬 Entretenimiento</option>
        <option value="ropa">👕 Ropa</option>
        <option value="educacion">📚 Educación</option>
        <option value="otros" selected>📦 Otros</option>
      </select>
    </div>
    <button class="btn-main" onclick="guardar()">Guardar gasto</button>
  </div>
</div>

<!-- SCREEN: HISTORIAL -->
<div id="s-historial" class="screen">
  <div class="topbar"><h1>Historial</h1><p>Todos tus gastos</p></div>
  <div class="filter-row">
    <select id="f-cat" onchange="renderHist()">
      <option value="">Todas las categorías</option>
      <option value="comida">Comida</option>
      <option value="transporte">Transporte</option>
      <option value="servicios">Servicios</option>
      <option value="salud">Salud</option>
      <option value="entretenimiento">Entretenimiento</option>
      <option value="ropa">Ropa</option>
      <option value="educacion">Educación</option>
      <option value="otros">Otros</option>
    </select>
    <select id="f-mes" onchange="renderHist()"><option value="">Todos los meses</option></select>
  </div>
  <div class="card" id="hist-list"></div>
</div>

<!-- SCREEN: RESUMEN -->
<div id="s-resumen" class="screen">
  <div class="topbar"><h1>Resumen</h1><p id="res-sub">Por categoría</p></div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-lbl">Este mes</div><div class="stat-val red" id="r-mes">$0</div></div>
    <div class="stat-card"><div class="stat-lbl">Registrados</div><div class="stat-val" id="r-cant">0</div></div>
  </div>
  <div class="card">
    <div class="card-title">Gastos del mes por categoría</div>
    <div id="res-bars"><div class="empty-state">Sin gastos este mes</div></div>
  </div>
</div>

<!-- NAVBAR -->
<nav class="navbar">
  <button class="nav-btn active" id="nb-home" onclick="nav('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12L12 4l9 8"/><path d="M5 10v9a1 1 0 001 1h4v-4h4v4h4a1 1 0 001-1v-9"/></svg>Inicio
  </button>
  <button class="nav-btn" id="nb-nuevo" onclick="nav('nuevo')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Nuevo
  </button>
  <button class="nav-btn" id="nb-historial" onclick="nav('historial')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Historial
  </button>
  <button class="nav-btn" id="nb-resumen" onclick="nav('resumen')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Resumen
  </button>
</nav>
</div>

<script>
const CAT={
  comida:{label:'Comida',icon:'🍔',color:'#FB923C'},
  transporte:{label:'Transporte',icon:'🚗',color:'#60A5FA'},
  servicios:{label:'Servicios',icon:'💡',color:'#A3E635'},
  salud:{label:'Salud',icon:'🏥',color:'#F472B6'},
  entretenimiento:{label:'Entretenimiento',icon:'🎬',color:'#A78BFA'},
  ropa:{label:'Ropa',icon:'👕',color:'#FBBF24'},
  educacion:{label:'Educación',icon:'📚',color:'#34D399'},
  otros:{label:'Otros',icon:'📦',color:'#94A3B8'},
};
const MESES_N=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESES_F=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

let gastos=[];
try{gastos=JSON.parse(localStorage.getItem('mis_gastos_v3')||'[]')}catch(e){}
function save(){try{localStorage.setItem('mis_gastos_v3',JSON.stringify(gastos))}catch(e){}}
function hoy(){return new Date().toISOString().slice(0,10)}
function mesAct(){return new Date().toISOString().slice(0,7)}
function fmtF(s){const[y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function fmtMes(s){const[y,m]=s.split('-');return `${MESES_N[+m-1]} ${y}`}
function fmt(n){return '$'+n.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})}

function toast(msg,ok=true){
  const t=document.getElementById('toast');
  t.style.background=ok?'var(--success)':'var(--danger)';
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

let curScreen='home';
function nav(s){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById('s-'+s).classList.add('active');
  document.getElementById('nb-'+s).classList.add('active');
  curScreen=s;
  if(s==='home')renderHome();
  if(s==='historial')renderHist();
  if(s==='resumen')renderRes();
}

function renderHome(){
  const mes=mesAct();
  const d=new Date();
  document.getElementById('home-mes').textContent=`${MESES_F[d.getMonth()]} ${d.getFullYear()}`;
  const tMes=gastos.filter(g=>g.fecha.startsWith(mes)).reduce((a,g)=>a+g.importe,0);
  const tGen=gastos.reduce((a,g)=>a+g.importe,0);
  document.getElementById('h-mes').textContent=fmt(tMes);
  document.getElementById('h-tot').textContent=fmt(tGen);
  const rec=gastos.slice(0,6);
  const el=document.getElementById('home-list');
  if(!rec.length){el.innerHTML='<div class="empty-state">Tocá + para agregar tu primer gasto</div>';return;}
  el.innerHTML=rec.map(g=>{
    const c=CAT[g.cat]||CAT.otros;
    return `<div class="item">
      <div class="item-icon" style="background:${c.color}22">${c.icon}</div>
      <div class="item-body">
        <div class="item-desc">${g.desc}</div>
        <div class="item-sub">${fmtF(g.fecha)} · ${c.label}</div>
      </div>
      <div class="item-amt">${fmt(g.importe)}</div>
    </div>`;}).join('');
}

function guardar(){
  const desc=document.getElementById('n-desc').value.trim();
  const imp=parseFloat(document.getElementById('n-imp').value);
  const fecha=document.getElementById('n-fecha').value;
  const cat=document.getElementById('n-cat').value;
  if(!desc||!imp||imp<=0||!fecha){toast('Completá todos los campos',false);return;}
  gastos.unshift({id:Date.now(),desc,importe:imp,fecha,cat});
  save();
  document.getElementById('n-desc').value='';
  document.getElementById('n-imp').value='';
  document.getElementById('n-fecha').value=hoy();
  toast('¡Gasto guardado!');
  setTimeout(()=>nav('home'),700);
}

function eliminar(id){
  if(!confirm('¿Eliminar este gasto?'))return;
  gastos=gastos.filter(g=>g.id!==id);
  save();renderHist();toast('Gasto eliminado');
}

function renderHist(){
  const fCat=document.getElementById('f-cat').value;
  const fMes=document.getElementById('f-mes').value;
  const meses=[...new Set(gastos.map(g=>g.fecha.slice(0,7)))].sort().reverse();
  const sel=document.getElementById('f-mes');
  const cur=sel.value;
  sel.innerHTML='<option value="">Todos los meses</option>';
  meses.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=fmtMes(m);sel.appendChild(o)});
  if(cur)sel.value=cur;
  let f=gastos.filter(g=>{
    if(fCat&&g.cat!==fCat)return false;
    if(fMes&&!g.fecha.startsWith(fMes))return false;
    return true;
  });
  const el=document.getElementById('hist-list');
  if(!f.length){el.innerHTML='<div class="empty-state">Sin gastos para mostrar</div>';return;}
  el.innerHTML=f.map(g=>{
    const c=CAT[g.cat]||CAT.otros;
    return `<div class="item">
      <div class="item-icon" style="background:${c.color}22">${c.icon}</div>
      <div class="item-body">
        <div class="item-desc">${g.desc}</div>
        <div class="item-sub">${fmtF(g.fecha)} · ${c.label}</div>
      </div>
      <div class="item-amt">${fmt(g.importe)}</div>
      <button class="item-del" onclick="eliminar(${g.id})">✕</button>
    </div>`;}).join('');
}

function renderRes(){
  const mes=mesAct();
  const d=new Date();
  document.getElementById('res-sub').textContent=`${MESES_F[d.getMonth()]} ${d.getFullYear()}`;
  const delMes=gastos.filter(g=>g.fecha.startsWith(mes));
  const tMes=delMes.reduce((a,g)=>a+g.importe,0);
  document.getElementById('r-mes').textContent=fmt(tMes);
  document.getElementById('r-cant').textContent=gastos.length;
  const porCat={};
  delMes.forEach(g=>{porCat[g.cat]=(porCat[g.cat]||0)+g.importe});
  const sorted=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const el=document.getElementById('res-bars');
  if(!sorted.length){el.innerHTML='<div class="empty-state">Sin gastos este mes</div>';return;}
  const max=sorted[0][1];
  el.innerHTML=sorted.map(([cat,amt])=>{
    const c=CAT[cat]||CAT.otros;
    return `<div class="bar-row">
      <div class="bar-icon">${c.icon}</div>
      <div class="bar-lbl">${c.label}</div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(amt/max*100)}%;background:${c.color}"></div></div>
      <div class="bar-amt">${fmt(amt)}</div>
    </div>`;}).join('');
}

// Init
document.getElementById('n-fecha').value=hoy();
renderHome();

// Mostrar banner de instalación en iOS
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.navigator.standalone;
if(isIOS&&!isStandalone){
  document.getElementById('install-banner').style.display='flex';
}
</script>
</body>
</html>
